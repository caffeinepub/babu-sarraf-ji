<html lang='en'>
    <head>
        <meta charset='UTF-8' />
        <meta name='viewport' content='width=device-width, initial-scale=1.0' />
        <title>Focus Babu</title>
        <meta name='theme-color' content='#0a0a1a' />
        <meta name='apple-mobile-web-app-capable' content='yes' />
        <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent' />
        <meta name='apple-mobile-web-app-title' content='FocusBabu' />
        <meta name='mobile-web-app-capable' content='yes' />
        <meta name='application-name' content='Focus Babu' />
        <link rel='manifest' href='/manifest.json' />
        <link rel='icon' type='image/png' sizes='64x64' href='/assets/generated/focus-babu-favicon.dim_64x64.png' />
        <link rel='icon' type='image/png' sizes='512x512' href='/assets/generated/focus-babu-logo.dim_512x512.png' />
        <link rel='shortcut icon' href='/assets/generated/focus-babu-favicon.dim_64x64.png' />
        <link rel='apple-touch-icon' href='/assets/generated/focus-babu-logo.dim_512x512.png' />
        <script>
            // Pre-hydration theme bootstrap: apply dark class before React mounts
            (function() {
                try {
                    const stored = localStorage.getItem('theme');
                    const theme = stored ? JSON.parse(stored) : 'dark';
                    if (theme === 'dark') {
                        document.documentElement.classList.add('dark');
                        document.documentElement.style.colorScheme = 'dark';
                    } else {
                        document.documentElement.classList.remove('dark');
                        document.documentElement.style.colorScheme = 'light';
                    }
                } catch (e) {
                    // Default to dark on error
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                }
            })();
        </script>
    </head>
    <body>
        <div id='root'></div>
        <script type='module' src='/src/main.tsx'></script>
    </body>
</html>
